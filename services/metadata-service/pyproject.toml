[project]
name = "metadata-service"
version = "0.1.0"
description = "Enriches downloaded/transcoded media with TMDb/MusicBrainz metadata and finalizes TV file layout for Jellyfin."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "guessit>=3.8",
    "mutagen>=1.47",
    "nats-py>=2.7",
    "rapidfuzz>=3.9",
    "tenacity>=8.5",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
