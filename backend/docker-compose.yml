name: home-streaming

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ./docker/jellyfin/config:/config
      - ./docker/jellyfin/cache:/cache
      # Jellyfin's only mount: the final, identified files. Read-only, so it can never touch the
      # library, and never sees staging/ or downloads/.
      - ${MEDIA_PATH}/library:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    # QSV as a safety net for clients that ask for something the file's format can't serve directly.
    # The node is mapped under the SAME path it has on the host: libdrm resolves the device from its
    # minor number, so renaming it (e.g. renderD129 -> renderD128) breaks libva.
    devices:
      - ${RENDER_DEVICE:-/dev/dri/renderD128}:${RENDER_DEVICE:-/dev/dri/renderD128}
    group_add:
      - "${RENDER_GID:-989}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "5432:5432"

  go_migrate:
    image: migrate/migrate:latest
    container_name: go_migrate
    volumes:
      - ./internal/migrations:/migrations
    command: [ ]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "migrate",
      "-path", "/migrations",
      "-database", "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable"
    ]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./docker/qbittorrent/config:/config
      # ONE mount: incomplete/ and the per-category folders live inside it, so qBittorrent's own
      # "move it into place" step stays a rename(2) within a single mount (atomic) instead of a copy.
      - ${MEDIA_PATH}/downloads:/data/downloads
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    ports:
      - "7070:7070"
    volumes:
      - .:/app
      - ${MEDIA_PATH}:/media
    devices:
      - ${RENDER_DEVICE}:${RENDER_DEVICE}
    env_file:
      - .env
    group_add:
      - "${RENDER_GID}"
    depends_on:
      - qbittorrent
      - postgres

volumes:
  pgdata:
