name: home-streaming

# v2 redesign: a single Go backend and a new frontend replace the v1 microservices. The `backend`
# and `frontend` services are added during the v2 scaffold; this file currently brings up the
# infrastructure the backend depends on. See docs/v2/README.md.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ./docker/jellyfin/config:/config
      - ./docker/jellyfin/cache:/cache
      # Jellyfin's only mount: the final, identified files. Read-only, so it can never touch the
      # library, and never sees staging/ or downloads/.
      - ${MEDIA_PATH}/library:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    # QSV as a safety net for clients that ask for something the file's format can't serve directly.
    # The node is mapped under the SAME path it has on the host: libdrm resolves the device from its
    # minor number, so renaming it (e.g. renderD129 -> renderD128) breaks libva.
    devices:
      - ${RENDER_DEVICE:-/dev/dri/renderD128}:${RENDER_DEVICE:-/dev/dri/renderD128}
    group_add:
      - "${RENDER_GID:-989}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "5432:5432"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./docker/qbittorrent/config:/config
      # ONE mount: incomplete/ and the per-category folders live inside it, so qBittorrent's own
      # "move it into place" step stays a rename(2) within a single mount (atomic) instead of a copy.
      - ${MEDIA_PATH}/downloads:/data/downloads
    restart: unless-stopped

  # backend:   # added during the v2 scaffold (Go monolith, ffmpeg+QSV, MEDIA_PATH mount)
  # frontend:  # added during the v2 scaffold (new SPA served by nginx)

volumes:
  pgdata:
