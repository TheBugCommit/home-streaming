x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://localhost:3100/loki/api/v1/push"
    loki-external-labels: "service={{.Name}}"

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ${VIDEOS_PATH}/streamable:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    restart: unless-stopped
    logging: *loki-logging

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    ports:
      - "8265:8265"
      - "8266:8266"
    volumes:
      - ./tdarr/server:/app/server
      - ./tdarr/configs:/app/configs
      - ./tdarr/logs:/app/logs
      - ${VIDEOS_PATH}/library:/data/library
      - ${VIDEOS_PATH}/streamable:/data/streamable
      - /tmp/tdarr-temp:/temp
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=6
      - nodeName=InternalNode
    restart: unless-stopped
    logging: *loki-logging
    # NOTE: production (dedicated server) has no GPU — this entry is CPU-only (libx264) by design.
    # For faster local iteration on a machine that does have an NVIDIA GPU, use:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.local.yml up
    # Never add `runtime: nvidia` here in the base file.

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *loki-logging

  nats:
    image: nats:2-alpine
    container_name: nats
    command: ["-js", "-sd", "/data"]
    volumes:
      - ./nats/data:/data
    restart: unless-stopped
    logging: *loki-logging

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbittorrent/config:/config
      - ${VIDEOS_PATH}/incoming:/data/incoming
      - ${VIDEOS_PATH}/library:/data/library
    restart: unless-stopped
    logging: *loki-logging

  core-api:
    build: ./services/core-api
    container_name: core-api
    ports:
      - "${CORE_API_PORT}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NATS_URL=${NATS_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    logging: *loki-logging

  torrent-worker:
    build: ./services/torrent-worker
    container_name: torrent-worker
    environment:
      - NATS_URL=${NATS_URL}
      - QBITTORRENT_URL=http://qbittorrent:${QBITTORRENT_WEBUI_PORT}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    depends_on:
      - qbittorrent
      - nats
    restart: unless-stopped
    logging: *loki-logging

  transcode-worker:
    build: ./services/transcode-worker
    container_name: transcode-worker
    environment:
      - NATS_URL=${NATS_URL}
      - TDARR_SERVER_URL=${TDARR_SERVER_URL}
      - TDARR_MOVIES_LIBRARY_ID=${TDARR_MOVIES_LIBRARY_ID}
      - TDARR_TV_LIBRARY_ID=${TDARR_TV_LIBRARY_ID}
      - TDARR_MUSIC_LIBRARY_ID=${TDARR_MUSIC_LIBRARY_ID}
      - JELLYFIN_URL=${JELLYFIN_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_MOVIES_LIBRARY_ID=${JELLYFIN_MOVIES_LIBRARY_ID}
      - JELLYFIN_TV_LIBRARY_ID=${JELLYFIN_TV_LIBRARY_ID}
      - JELLYFIN_MUSIC_LIBRARY_ID=${JELLYFIN_MUSIC_LIBRARY_ID}
    depends_on:
      - tdarr
      - nats
      - jellyfin
    restart: unless-stopped
    logging: *loki-logging

  metadata-service:
    build: ./services/metadata-service
    container_name: metadata-service
    environment:
      - NATS_URL=${NATS_URL}
      - CORE_API_INTERNAL_URL=http://core-api:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT}
    volumes:
      # Scoped write access, only this service renames/moves TV episodes into Jellyfin's naming
      # convention once the real series/season/episode identity is known (see shared/events/README.md).
      - ${VIDEOS_PATH}/streamable/tv:/data/streamable/tv
    depends_on:
      - nats
      - core-api
    restart: unless-stopped
    logging: *loki-logging

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pgdata:
